<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{person}">
    <f:asset.css identifier="personal-data-block" href="EXT:personal_data_block/Resources/Public/Css/personal-data-block.css" />
    <div class="personal-data-block">
        <p class="personal-data-block__name">{person.name}</p>
        <f:if condition="{person.email}">
            <p><f:link.email email="{person.email}">{person.email}</f:link.email></p>
        </f:if>
    </div>
</f:if>
</html>
